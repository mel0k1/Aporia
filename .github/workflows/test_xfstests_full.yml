name: Test xfstests full

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

jobs:
  xfstests-full:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
      volumes:
        - /usr/lib/google-cloud-sdk:/usr/lib/google-cloud-sdk
        - /usr/local/lib/android:/usr/local/lib/android
        - /usr/share/dotnet:/usr/share/dotnet
    timeout-minutes: 360
    steps:
      - name: Check KVM
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "kvm=true" >> "$GITHUB_OUTPUT"
          else
            echo "kvm=false" >> "$GITHUB_OUTPUT"
            echo "full.list requires a runner with /dev/kvm, skipping"
          fi
      - uses: actions/checkout@v4
        if: steps.kvm.outputs.kvm == 'true'
      - name: Run xfstests full.list
        if: steps.kvm.outputs.kvm == 'true'
        uses: ./.github/actions/test
        with:
          auto_test: 'conformance'
          conformance_test_suite: 'xfstests'
          release: true
          mem: '12G'
          xfstests_fs_type: 'ext2'
          xfstests_runlist: 'full.list'
          xfstests_disk_size: '12G'
          restore_osdk_from_cache: true
          restore_kernel_from_cache: true
