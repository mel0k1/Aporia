
[workspace]
resolver = "2"
members = [
    "osdk/deps/frame-allocator",
    "osdk/deps/heap-allocator",
    "osdk/deps/test-kernel",
    "ostd",
    "ostd/libs/align_ext",
    "ostd/libs/id-alloc",
    "ostd/libs/int-to-c-enum",
    "ostd/libs/int-to-c-enum/derive",
    "ostd/libs/linux-bzimage/boot-params",
    "ostd/libs/linux-bzimage/builder",
    "ostd/libs/linux-bzimage/setup",
    "ostd/libs/ostd-macros",
    "ostd/libs/ostd-pod",
    "ostd/libs/ostd-pod/macros",
    "ostd/libs/ostd-test",
    "ostd/libs/padding-struct",
    "kernel",
    "kernel/comps/drm",
    "kernel/comps/i8042",
    "kernel/comps/simpledrm",
    "kernel/comps/uart",
    "kernel/core",
    "kernel/core/comps/block",
    "kernel/core/comps/cmdline",
    "kernel/core/comps/console",
    "kernel/core/comps/device",
    "kernel/core/comps/framebuffer",
    "kernel/core/comps/input",
    "kernel/core/comps/logger",
    "kernel/core/comps/mlsdisk",
    "kernel/core/comps/network",
    "kernel/core/comps/nvme",
    "kernel/core/comps/pci",
    "kernel/core/comps/softirq",
    "kernel/core/comps/systree",
    "kernel/core/comps/time",
    "kernel/core/comps/virtio",
    "kernel/libs/aster-bigtcp",
    "kernel/libs/aster-fuse",
    "kernel/libs/aster-rights",
    "kernel/libs/aster-rights-proc",
    "kernel/libs/aster-util",
    "kernel/libs/atomic-integer-wrapper",
    "kernel/libs/cpio-decoder",
    "kernel/libs/device-id",
    "kernel/libs/dma-pool",
    "kernel/libs/fdt-util",
    "kernel/libs/io-util",
    "kernel/libs/jhash",
    "kernel/libs/keyable-arc",
    "kernel/libs/logo-ascii-art",
    "kernel/libs/ring-buffer",
    "kernel/libs/sparse-id-alloc",
    "kernel/libs/short-vis-path",
    "kernel/libs/typeflags",
    "kernel/libs/typeflags-util",
    "kernel/libs/xarray",
]
default-members = [
    "osdk/deps/frame-allocator",
    "osdk/deps/heap-allocator",
    "osdk/deps/test-kernel",
    "ostd",
    "kernel",
    "kernel/comps/drm",
    "kernel/comps/i8042",
    "kernel/comps/simpledrm",
    "kernel/comps/uart",
    "kernel/core",
    "kernel/core/comps/block",
    "kernel/core/comps/cmdline",
    "kernel/core/comps/console",
    "kernel/core/comps/device",
    "kernel/core/comps/framebuffer",
    "kernel/core/comps/input",
    "kernel/core/comps/logger",
    "kernel/core/comps/mlsdisk",
    "kernel/core/comps/network",
    "kernel/core/comps/nvme",
    "kernel/core/comps/pci",
    "kernel/core/comps/softirq",
    "kernel/core/comps/systree",
    "kernel/core/comps/time",
    "kernel/core/comps/virtio",
    "kernel/libs/aster-bigtcp",
    "kernel/libs/aster-fuse",
    "kernel/libs/aster-util",
    "kernel/libs/device-id",
    "kernel/libs/dma-pool",
    "kernel/libs/fdt-util",
    "kernel/libs/io-util",
    "kernel/libs/ring-buffer",
    "kernel/libs/sparse-id-alloc",
    "kernel/libs/xarray",
]
exclude = [
    "kernel/libs/comp-sys/cargo-component",
    "kernel/libs/comp-sys/component",
    "kernel/libs/comp-sys/component-macro",
    "kernel/libs/comp-sys/controlled",
    "osdk",
    "tools/sctrace",
]

[workspace.lints.rust]
redundant_imports = "warn"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(ktest)'] }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
inconsistent_struct_constructor = "warn"
redundant_test_prefix = "warn"

[workspace.package]
version = "0.19.0"
repository = "https://github.com/asterinas/asterinas"
license = "MPL-2.0"
edition = "2024"

[workspace.dependencies]
ostd = { path = "ostd", version = "0.19.0" }

align_ext = { path = "ostd/libs/align_ext", version = "0.1.0" }
id-alloc = { path = "ostd/libs/id-alloc", version = "0.1.0" }
int-to-c-enum = { path = "ostd/libs/int-to-c-enum", version = "0.2.0" }
int-to-c-enum-derive = { path = "ostd/libs/int-to-c-enum/derive", version = "0.2.0" }
linux-boot-params = { path = "ostd/libs/linux-bzimage/boot-params", version = "0.19.0" }
ostd-macros = { path = "ostd/libs/ostd-macros", version = "0.19.0" }
ostd-pod = { path = "ostd/libs/ostd-pod", version = "0.4.0" }
ostd-pod-macros = { path = "ostd/libs/ostd-pod/macros", version = "0.4.0" }
ostd-test = { path = "ostd/libs/ostd-test", version = "0.19.0" }
padding-struct = { path = "ostd/libs/padding-struct", version = "0.2.0" }

aster-core = { path = "kernel/core", default-features = false }

aster-drm = { path = "kernel/comps/drm" }
aster-i8042 = { path = "kernel/comps/i8042" }
aster-simpledrm = { path = "kernel/comps/simpledrm" }
aster-uart = { path = "kernel/comps/uart" }

aster-block = { path = "kernel/core/comps/block" }
aster-cmdline = { path = "kernel/core/comps/cmdline" }
aster-console = { path = "kernel/core/comps/console" }
aster-device = { path = "kernel/core/comps/device" }
aster-framebuffer = { path = "kernel/core/comps/framebuffer" }
aster-input = { path = "kernel/core/comps/input" }
aster-logger = { path = "kernel/core/comps/logger" }
aster-network = { path = "kernel/core/comps/network" }
aster-nvme = { path = "kernel/core/comps/nvme" }
aster-pci = { path = "kernel/core/comps/pci" }
aster-softirq = { path = "kernel/core/comps/softirq" }
aster-systree = { path = "kernel/core/comps/systree" }
aster-time = { path = "kernel/core/comps/time" }
aster-virtio = { path = "kernel/core/comps/virtio" }

aster-bigtcp = { path = "kernel/libs/aster-bigtcp" }
aster-fuse = { path = "kernel/libs/aster-fuse" }
aster-rights = { path = "kernel/libs/aster-rights" }
aster-rights-proc = { path = "kernel/libs/aster-rights-proc" }
aster-util = { path = "kernel/libs/aster-util" }
atomic-integer-wrapper = { path = "kernel/libs/atomic-integer-wrapper" }
cpio-decoder = { path = "kernel/libs/cpio-decoder" }
device-id = { path = "kernel/libs/device-id" }
dma-pool = { path = "kernel/libs/dma-pool" }
fdt-util = { path = "kernel/libs/fdt-util" }
io-util = { path = "kernel/libs/io-util" }
jhash = { path = "kernel/libs/jhash" }
keyable-arc = { path = "kernel/libs/keyable-arc" }
logo-ascii-art = { path = "kernel/libs/logo-ascii-art" }
ring-buffer = { path = "kernel/libs/ring-buffer" }
short-vis-path = { path = "kernel/libs/short-vis-path" }
sparse-id-alloc = { path = "kernel/libs/sparse-id-alloc" }
typeflags = { path = "kernel/libs/typeflags" }
typeflags-util = { path = "kernel/libs/typeflags-util" }
xarray = { path = "kernel/libs/xarray" }

component = { path = "kernel/libs/comp-sys/component" }

osdk-frame-allocator = { path = "osdk/deps/frame-allocator" }
osdk-heap-allocator = { path = "osdk/deps/heap-allocator" }

acpi = "=5.2.0"
bit_field = "0.10.4"
gimli = { version = "0.28", default-features = false, features = ["read-core"] }
minicov = "=0.3.9"
multiboot2 = "0.24.0"
num-traits = { version = "0.2", default-features = false }
sbi-rt = "0.0.3"
serde = { version = "1.0.192", default-features = false, features = ["alloc", "derive"] }
smallvec = "1.13.2"
uart_16550 = "0.3.0"
uefi = { version = "0.37.0", features = ["global_allocator", "panic_handler", "logger", "qemu"]}
uefi-raw = "0.14.0"
volatile = "0.6.1"
x86 = "0.52.0"

aes-gcm = { version = "0.9.4", features = ["force-soft"] }
bittle = "0.5.6"
chrono = { version = "0.4.38", default-features = false }
const_format = "0.2.35"
ctr = "0.8.0"
font8x8 = { version = "0.2.5", default-features = false, features = [ "unicode" ] }
getset = "0.1.2"
hashbrown = { version = "0.14.3", features = ["serde"]  }
inventory = "0.3.24"
itertools = "0.10.5"
lending-iterator = "0.1.7"
lru = "0.16.3"
owo-colors = "4.2.2"
paste = "1.0.15"
postcard = "1.0.6"
smoltcp = { git = "https://github.com/asterinas/smoltcp", tag = "r_2026-08-11_1b7629c", default-features = false, features = [
    "alloc",
    "log",
    "medium-ethernet",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-udp",
    "socket-tcp",
] }
takeable = "0.2.2"
time = { version = "0.3", default-features = false, features = ["alloc"] }

bitflags = "2.13"
bitvec = { version = "1.0.1", default-features = false, features = ["alloc"] }
crc32fast = "1.4"
fdt = { version = "0.1.5", features = ["pretty-printing"] }
inherit-methods-macro = { git = "https://github.com/asterinas/inherit-methods-macro", rev = "98f7e3e", version = "0.1.0" }
intrusive-collections = { version = "0.9.6", features = ["nightly"] }
log = "0.4"
loongArch64 = "0.2.5"
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
rand = { version = "0.9.2", default-features = false }
riscv = { version = "0.15.0", features = ["s-mode"] }
spin = "0.9.4"
tdx-guest = "0.5.0"
unwinding = { version = "0.2.11", default-features = false, features = ["hide-trace", "panic", "personality", "unwinder"] }
x86_64 = "0.15.5"
xmas-elf = "0.10.0"
zerocopy = { version = "0.8.34", features = [ "derive" ] }

proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
quote = "1.0.35"
syn = { version = "2.0.77", features = ["full", "parsing", "fold", "visit-mut"] }


[profile.dev]
panic = "unwind"

[profile.release]
lto = "thin"
panic = "unwind"

[profile.release-lto]
inherits = "release"
lto = true
panic = "abort"
codegen-units = 1
