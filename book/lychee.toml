
verbose = "error"

format = "detailed"

no_progress = true

insecure = true

exclude_path = [
  "SUMMARY.md",
]

root_dir = "book"
include_fragments = "full"
remap = [
  "(file:///.+)\\.html#(.+) $0",
  "(file:///.+)#(.+) $1/index.html#$2",
  "(file:///.+)/README.html $1/index.html",
]

method = "get"

header = { "accept" = "text/html" }

user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36"

cache = true

max_cache_age = "90d"

threads = 1
max_concurrency = 3

[hosts."www.gnu.org"]
concurrency = 1
request_interval = "2s"
