
[assign]

[relabel]
allow-unauthenticated = [
    "C-*",
    "!C-good-first-issue",
    "O-*",
    "S-stale"
]

[mentions.".github/ISSUE_TEMPLATE"]
cc = ["@grief8"]

[shortcut]

[review-submitted]
reviewed_label = "S-waiting-on-author"
review_labels = ["S-waiting-on-review"]

[review-requested]
remove_labels = ["S-waiting-on-author"]
add_labels = ["S-waiting-on-review"]
