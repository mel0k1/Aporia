[package]
name = "cargo-component"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]
members = ["analysis"]
resolver = "3"


[[bin]]
name = "cargo-component"
test = false
path = "src/main.rs"

[[bin]]
name = "component-driver"
path = "src/driver.rs"

[dependencies]
rustc_tools_util = "0.3.0"
analysis = { path = "analysis" }

[build-dependencies]
rustc_tools_util = "0.3.0"

[package.metadata.rust-analyzer]
rustc_private = true
